
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Frases Afirmativas – Teragón</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5fdf8;
            color: #267a6d;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .logo {
            max-width: 160px;
            margin-bottom: 20px;
        }

        .frase {
            font-size: 6vw;
            font-weight: bold;
            margin: 40px 20px;
            max-width: 90%;
            text-align: center;
            line-height: 1.4;
        }

        button {
            background-color: #267a6d;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1.2em;
            cursor: pointer;
            border-radius: 8px;
            margin-top: 10px;
        }

        footer {
            margin-top: 40px;
            font-size: 0.8em;
            text-align: center;
            color: #666;
            padding-bottom: 20px;
        }

        @media (max-width: 600px) {
            .frase {
                font-size: 7vw;
            }

            button {
                font-size: 1em;
                padding: 12px 24px;
            }
        }
    </style>
</head>
<body>
    <img src="logo-teragon.png" alt="Logo de Teragón" class="logo">
    <div class="frase" id="frase">Haz clic para descubrir tu frase 🌿</div>
    <button id="boton" onclick="mostrarFrase()">Mostrar frase</button>

    <footer>
        <p><strong>Teragón</strong> – Terapia en movimiento, guiada por la naturaleza<br>
        <em>Proyecto en desarrollo. NSV</em></p>
    </footer>

    <script>
        const frases = [
            "Soy suficiente tal como soy.",
            "Mi historia importa.",
            "Merezco amor y cuidado.",
            "Estoy floreciendo a mi ritmo.",
            "Puedo reinventarme cada día.",
            "Lo que siento es válido.",
            "Tengo permiso para descansar.",
            "Soy parte de algo más grande.",
            "Estoy aprendiendo a cuidarme.",
            "Mi voz tiene poder.",
            "Mi identidad es sagrada.",
            "Hoy elijo ser amable conmigo.",
            "Estoy creciendo desde mis raíces.",
            "Habitarme también es resistencia.",
            "Tengo derecho a poner límites.",
            "La ternura también es fuerza.",
            "Estoy sembrando algo nuevo.",
            "Mi cuerpo es un hogar digno de respeto.",
            "Mi valor no depende de la aprobación externa."
        ];

        function mostrarFrase() {
            const random = Math.floor(Math.random() * frases.length);
            document.getElementById("frase").textContent = frases[random];
            document.getElementById("boton").textContent = "Ver otra frase";
        }
    </script>
</body>
</html>
