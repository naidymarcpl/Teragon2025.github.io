
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Frases Afirmativas – Teragón</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5fdf8;
            color: #333;
            text-align: center;
            padding: 40px;
        }
        .logo {
            max-width: 200px;
            margin-bottom: 20px;
        }
        .frase {
            font-size: 1.4em;
            font-weight: bold;
            color: #267a6d;
            margin: 40px 0;
        }
        button {
            background-color: #267a6d;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1em;
            cursor: pointer;
            border-radius: 8px;
        }
        footer {
            margin-top: 60px;
            font-size: 0.85em;
            color: #666;
        }
    </style>
</head>
<body>
    <img src="logo-teragon.png" alt="Logo de Teragón" class="logo">
    <h1>Tu frase afirmativa del día</h1>
    <div class="frase" id="frase">Haz clic para descubrir tu frase 🌿</div>
    <button onclick="mostrarFrase()">Mostrar frase</button>

    <footer>
        <p><strong>Teragón</strong> – Terapia en movimiento, guiada por la naturaleza</p>
        <p><em>Proyecto en desarrollo NSV.<br>
        Identidad visual y estructura legal en formación.</em></p>
    </footer>

    <script>
        const frases = [
            "Soy suficiente tal como soy.",
            "Mi historia importa.",
            "Merezco amor y cuidado.",
            "Estoy floreciendo a mi ritmo.",
            "Puedo reinventarme cada día.",
            "Lo que siento es válido.",
            "Tengo permiso para descansar.",
            "Soy parte de algo más grande.",
            "Estoy aprendiendo a cuidarme.",
            "Mi voz tiene poder.",
            "Mi identidad es sagrada.",
            "Hoy elijo ser amable conmigo.",
            "Estoy creciendo desde mis raíces.",
            "Habitarme también es resistencia.",
            "Tengo derecho a poner límites.",
            "La ternura también es fuerza.",
            "Estoy sembrando algo nuevo.",
            "Mi cuerpo es un hogar digno de respeto.",
            "Mi valor no depende de la aprobación externa."
        ];

        function mostrarFrase() {
            const random = Math.floor(Math.random() * frases.length);
            document.getElementById("frase").textContent = frases[random];
        }
    </script>
</body>
</html>
